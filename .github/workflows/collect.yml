name: News Bot Collector

on:
  schedule:
    - cron: '0 1 * * 2,4'
  workflow_dispatch:
    inputs:
      days_lookback:
        description: '조회 기간(일)'
        required: false
        default: '5'
      ignore_cache:
        description: '캐시 무시 (true/false)'
        required: false
        default: 'false'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS_LOOKBACK: ${{ github.event.inputs.days_lookback || '5' }}
          IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
        run: python collector.py
